<!DOCTYPE html>
<html>
<head>
    <title>Reset Admin - HNA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            margin: 0 0 10px;
            color: #333;
        }
        p {
            color: #666;
            margin: 0 0 30px;
        }
        button {
            background: #ff7a18;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #ff6a00;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,122,24,0.4);
        }
        .success {
            color: #22c55e;
            font-weight: 600;
            display: none;
            margin-top: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔄</div>
        <h1>Reset Admin Account</h1>
        <p>This will clear all users, products, and cart data from localStorage. You can then create a new admin account.</p>
        <button onclick="resetData()">Reset All Data</button>
        <p class="success" id="success">✓ Data cleared! Close this page and refresh your site to create a new admin account.</p>
    </div>

    <script>
        function resetData() {
            localStorage.removeItem('heyfa_user');
            localStorage.removeItem('heyfa_users');
            localStorage.removeItem('heyfa_products');
            localStorage.removeItem('heyfa_cart');
            
            document.getElementById('success').style.display = 'block';
            
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }
    </script>
</body>
</html>
